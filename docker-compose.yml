version: '3.8'

services:
  frog_image:
    build:
      context: .
    image: frog_image

  highway:
    image: frog_image
    command: "python bin/highway.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  orderbook:
    image: frog_image
    command: "python bin/orderbook.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  tradecollector:
    image: frog_image
    command: "python bin/tradecollector.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  tradestore:
    image: frog_image
    command: "python bin/tradestore.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always
    volumes:
      - ./data:/data/

  analyst:
    image: frog_image
    command: "python bin/analyst.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  nobifake:
    image: frog_image
    command: "python bin/nobifake_oms.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  eye:
    image: frog_image
    command: "python bin/eye.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always
