version: "3.8"

services:
  frog_image:
    build:
      context: .
    image: frog_image

  highway:
    image: frog_image
    command: "python bin/highway.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  orderbook:
    image: frog_image
    command: "python bin/orderbook.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  tradecollector:
    image: frog_image
    command: "python bin/tradecollector.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  tradestore:
    image: frog_image
    command: "python bin/tradestore.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always
    volumes:
      - ./data:/data/

  price_service:
    image: frog_image
    command: "python bin/price_service.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always
    volumes:
      - ./data:/data/

  analyst:
    image: frog_image
    command: "python bin/analyst.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  nobifake:
    image: frog_image
    command: "python bin/nobifake_oms.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  eye:
    image: frog_image
    command: "python bin/eye.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  guardian:
    image: frog_image
    command: "python bin/guardian.py"
    environment:
      - ENV=PROD
      - LOG_LEVEL=INFO
      - PYTHONHASHSEED=0
    restart: always

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    restart: always
    ports:
      - "5477:5432"
    environment:
      - POSTGRES_USER=db
      - POSTGRES_PASSWORD=db
      - POSTGRES_DB=db
    volumes:
      - ./configs/analysisdb/002_set_configs.sh:/docker-entrypoint-initdb.d/002_set_configs.sh
      - ./configs/analysisdb/analysisdb.conf:/analysisdb.conf
      - ./data/timescaledb/:/var/lib/postgresql/data/
