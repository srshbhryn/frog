version: '3.8'

services:
  highway:
    image: frog_image
    command: "python cmd/highway.py"
    env_file:
      - .env
    restart: always

  frog_image:
    build:
      context: .
    image: frog_image

  orderbook:
    image: frog_image
    command: "python cmd/orderbook.py"
    env_file:
      - .env
    restart: always

  tradecollector:
    image: frog_image
    command: "python cmd/tradecollector.py"
    env_file:
      - .env
    restart: always

  tradestore:
    image: frog_image
    command: "python cmd/tradestore.py"
    env_file:
      - .env
    restart: always
    volumes:
      - ./data:/data/
