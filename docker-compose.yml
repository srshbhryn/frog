version: '3.8'

services:
  frog_image:
    build:
      context: .
    image: frog_image

  highway:
    image: frog_image
    command: "python cmd/highway.py"
    env_file:
      - .env
    restart: always

  orderbook:
    image: frog_image
    command: "python cmd/orderbook.py"
    env_file:
      - .env
    restart: always

  tradecollector:
    image: frog_image
    command: "python cmd/tradecollector.py"
    env_file:
      - .env
    restart: always

  tradestore:
    image: frog_image
    command: "python cmd/tradestore.py"
    env_file:
      - .env
    restart: always
    volumes:
      - ./data:/data/

  analyst:
    image: frog_image
    command: "python cmd/analyst.py"
    env_file:
      - .env
    restart: always

  nobifake:
    image: frog_image
    command: "python cmd/nobifake_oms.py"
    env_file:
      - .env
    restart: always

  eye:
    image: frog_image
    command: "python cmd/eye.py"
    env_file:
      - .env
    restart: always
