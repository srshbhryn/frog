[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [".", "./venv/lib/python3.10/site-packages/"]

[tool.black]
skip-string-normalization = true

[tool.isort]
profile = "black"
known_third_party = ["pytest"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"

[tool.pylint.MASTER]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "too-few-public-methods",

]

[tool.pytype]
keep_going = true
platform = "linux"
bind_decorated_methods = true
overriding_renamed_parameter_count_checks = true
use_enum_overlay = true
use_fiddle_overlay = true
precise_return = true
protocols = true
strict_import = true
strict_parameter_checks = true
strict_primitive_comparisons = true
strict_undefined_checks = true


[tool.ruff]


